<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sri Lanka Business Brain</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#view">Skip to content</a>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation">
    <div class="brand"><span class="logo" aria-hidden="true">B</span><span>Business Brain</span></div>
    <nav id="nav"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <button class="icon" id="menuBtn" aria-label="Toggle sidebar">☰</button>
      <strong id="bizName" class="biz"></strong>
      <input id="search" type="search" placeholder="Search customers, orders, products ( / )" aria-label="Global search">
      <select id="lang" aria-label="Language"><option value="en">English</option><option value="si">සිංහල</option><option value="ta">தமிழ்</option></select>
      <button class="icon" id="themeBtn" aria-label="Toggle light or dark mode">◐</button>
      <button class="icon" id="notifBtn" aria-label="Notifications">🔔<span id="notifN" class="dot"></span></button>
      <button class="icon avatar" id="profBtn" aria-label="Profile">AP</button>
    </header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom" id="bottomNav" aria-label="Quick navigation"></nav>
<dialog id="dlg"></dialog>
<div id="toasts" role="status" aria-live="polite"></div>
<script src="script.js"></script>
</body>
</html>
